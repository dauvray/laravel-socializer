server {
   listen 443 ssl;
   listen [::]:443 ssl;
   server_name sockets.eblog-dev;

    ssl_certificate /etc/ssl/certs/web-innov-dev.ghu-paris.fr.cer;
    ssl_certificate_key /etc/ssl/private/web-innov-dev.ghu-paris.fr.key;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:3DES:!aNULL:!MD5:!SEED:!IDEA;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
    }

}

server {
    listen 80;
    listen [::]:80;
    server_name  eblog-dev;
    return 301 https://eblog-dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name  eblog-dev;
    root /var/www/estarter-test/public;

    # Sécurité
    add_header   X-Frame-Options "";
    # Protection contre les attaques XSS
    add_header   X-XSS-Protection "1; mode=block" always;
    # Empêche le reniflage des types MIME
    add_header   X-Content-Type-Options "nosniff" always;
    # Configure la politique de referrer
    add_header Referrer-Policy "no-referrer-when-downgrade";
    # HSTS pour forcer HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    index        index.html index.htm index.php;
    charset      utf-8;

    # Réduction du temps d'attente
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    send_timeout 30s;

    # SSL/TLS Configuration
    ssl_certificate /etc/ssl/certs/web-innov-dev.ghu-paris.fr.cer;
    ssl_certificate_key /etc/ssl/private/web-innov-dev.ghu-paris.fr.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    # Utilisation de TLS 1.3 si possible pour une sécurité et performance accrues   
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Configuration des fichiers PHP
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php-fpm/www.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # WebSocket pour /peers
    location /peers {
        proxy_pass http://localhost:9000/peers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Caching pour les fichiers statiques (CSS, JS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        # Laisser Laravel traiter les requêtes spécifiques
        try_files $uri /index.php?$query_string;
    }

    # Sécuriser l'accès aux fichiers cachés et sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }
}